name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端（编译 + 单元测试）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 赋予 mvnw 执行权限
        run: chmod +x backend/mvnw

      - name: 单元测试
        working-directory: backend
        run: ./mvnw -B -ntp test

      - name: 打包可执行 jar
        working-directory: backend
        run: ./mvnw -B -ntp package -DskipTests

      - name: 启动服务并做接口冒烟测试
        working-directory: backend
        run: |
          # 关掉 bash 的 -e：这一段是"测试脚本"，要自己收集失败并统一退出，
          # 不能让任何一条命令的非零返回码提前终止整个步骤。
          set +e

          java -Dfile.encoding=UTF-8 -jar target/*.jar --spring.profiles.active=dev &
          APP_PID=$!

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8080/api/v3/api-docs; then
              echo "服务已就绪（${i}s）"; break
            fi
            sleep 1
          done

          BASE=http://localhost:8080/api
          TOKEN=$(curl -s -X POST "$BASE/auth/login" \
            -H "Content-Type: application/json" \
            --data-binary '{"username":"admin","password":"admin123"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')

          echo "token 长度: ${#TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "登录失败，终止测试"
            kill $APP_PID 2>/dev/null
            exit 1
          fi

          fail=0

          # 提取响应体里的业务码
          code_of() {
            curl -s "$@" | sed -n 's/.*"code":\([0-9]*\).*/\1/p' | head -n1
          }

          check() {
            want="$1"
            desc="$2"
            shift 2
            got=$(code_of "$@")
            if [ "$got" = "$want" ]; then
              echo "  [PASS] $desc (code=$got)"
            else
              echo "  [FAIL] $desc：期望 $want，实际 '$got'"
              fail=1
            fi
          }

          echo "::group::接口断言"
          check 200 "设备分页查询"   -H "Authorization: Bearer $TOKEN" "$BASE/equipments?pageNum=1&pageSize=5"
          check 200 "任务分页查询"   -H "Authorization: Bearer $TOKEN" "$BASE/tasks?pageNum=1&pageSize=5"
          check 200 "看板统计"       -H "Authorization: Bearer $TOKEN" "$BASE/dashboard"
          check 401 "无 token 被拒"  "$BASE/equipments"
          check 404 "资源不存在"     -H "Authorization: Bearer $TOKEN" "$BASE/equipments/999999"
          check 404 "接口路径不存在" -H "Authorization: Bearer $TOKEN" "$BASE/not-exist"
          echo "::endgroup::"

          kill $APP_PID 2>/dev/null
          exit $fail

  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: 安装依赖
        working-directory: frontend
        run: npm install --no-fund --no-audit

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
