# ============================================================
# dev：H2 内存数据库（零依赖，clone 下来就能跑）
#   - 数据库在 JVM 内存里，重启后数据重置为初始种子数据
#   - 控制台：http://localhost:8080/api/h2-console
#     JDBC URL: jdbc:h2:mem:inspection
#     用户名: sa    密码: (空)
# ============================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:inspection;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      data-locations: classpath:data-h2.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  web:
    resources:
      # 上传的巡检照片通过 /api/files/** 访问
      static-locations: file:./uploads/
