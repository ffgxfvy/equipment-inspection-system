# Maven Wrapper 配置
#
# distributionUrl 使用 Maven 中央仓库的规范地址（maven-wrapper 官方默认位置）。
# 首次执行 ./mvnw 或 mvnw.cmd 会自动把 Maven 下载到 ~/.m2/wrapper 下，之后复用。
#
# 如果下载慢，可以换成公司内网镜像；注意部分公共镜像会拒绝 wrapper 脚本的
# 下载请求（返回 403），这种镜像不能用于此项配置。
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
